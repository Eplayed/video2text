<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>video2text · 抖音采集</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--border:#2a3a50;--text:#e2e8f0;--muted:#8899aa;--accent:#3b82f6;--accent2:#6366f1;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.app{display:grid;grid-template-columns:420px 1fr;height:100vh;max-width:100vw}
/* ── 左侧面板 ── */
.panel-left{border-right:1px solid var(--border);overflow-y:auto;padding:20px}
.panel-left h1{font-size:18px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel-left .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
.section-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.form-group textarea,.form-group input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:13px;outline:none;transition:border .15s}
.form-group textarea:focus,.form-group input:focus{border-color:var(--accent)}
.form-group textarea{font-family:SFMono-Regular,Consolas,monospace;font-size:12px;resize:vertical}
.form-group .hint{font-size:11px;color:var(--muted);margin-top:3px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-success{background:var(--success);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
/* 状态区 */
.status-box{background:var(--card);border-radius:8px;padding:14px;margin-top:16px;min-height:80px}
.status-box .label{color:var(--muted);font-size:11px;margin-bottom:4px}
.status-box .msg{font-size:13px}
.status-box .error{color:var(--danger);white-space:pre-wrap;font-size:12px;margin-top:8px}
.status-running .msg{color:var(--accent)}
.status-done .msg{color:var(--success)}
.status-error .msg{color:var(--danger)}
/* ── 右侧面板 ── */
.panel-right{display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--card);color:var(--text);font-size:13px;outline:none;flex:1;min-width:150px}
.toolbar input:focus{border-color:var(--accent)}
.toolbar select{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:12px;outline:none}
.toolbar .count{color:var(--muted);font-size:13px;white-space:nowrap}
.video-grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-content:start}
.video-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border .15s,transform .1s;position:relative}
.video-card.selected{border-color:var(--accent);background:rgba(59,130,246,0.1)}
.video-card .checkbox{position:absolute;top:10px;right:10px;width:20px;height:20px;border:2px solid var(--border);border-radius:4px;background:var(--card);cursor:pointer;transition:all .15s}
.video-card.selected .checkbox{background:var(--accent);border-color:var(--accent)}
.video-card.selected .checkbox::after{content:"✓";color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;height:100%}
.video-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.video-card .author{font-size:11px;color:var(--muted);margin-bottom:4px}
.video-card .author .badge{display:inline-block;background:var(--accent2);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;margin-left:6px}
.video-card .title{font-size:14px;font-weight:600;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-card .desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-card .meta{display:flex;gap:8px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.video-card .meta span{background:rgba(255,255,255,.04);padding:2px 8px;border-radius:4px}
/* ── 详情弹窗 ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:90%;max-width:720px;max-height:85vh;overflow-y:auto;padding:24px;position:relative}
.modal h2{font-size:18px;margin-bottom:6px;padding-right:36px}
.modal .close-btn{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:4px;line-height:1}
.modal .close-btn:hover{color:var(--text)}
.modal .info-line{color:var(--muted);font-size:12px;margin-bottom:16px}
.modal .section{margin-bottom:16px}
.modal .section h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.modal .section .content{font-size:13px;line-height:1.7;background:rgba(0,0,0,.2);border-radius:8px;padding:12px;white-space:pre-wrap;max-height:300px;overflow-y:auto}
.modal .tags{display:flex;gap:6px;flex-wrap:wrap}
.modal .tags span{background:var(--accent);color:#fff;border-radius:4px;padding:2px 8px;font-size:11px}
.modal .actions{display:flex;gap:8px;margin-top:20px;padding-top:12px;border-top:1px solid var(--border)}
/* 链接按钮 */
.copy-btn{cursor:pointer;color:var(--accent);font-size:12px;text-decoration:underline}
/* 状态 badge */
.badge-done{background:var(--success);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px}
.badge-pending{background:var(--warn);color:#000;border-radius:4px;padding:1px 6px;font-size:10px}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧 -->
  <div class="panel-left">
    <h1>🎬 video2text</h1>
    <div class="sub">抖音视频采集 & 内容管理</div>

    <div class="section-label">添加新视频</div>
    <div class="form-group">
      <label>抖音链接 <span style="color:var(--danger)">*</span></label>
      <textarea id="links" rows="3" placeholder="每行一个抖音链接&#10;例如: https://v.douyin.com/xxxx/"></textarea>
      <div class="hint">支持短链接格式 v.douyin.com/xxx</div>
    </div>
    <div class="form-group">
      <label>Cookie (sessionid) <span style="color:var(--danger)">*</span></label>
      <input id="cookie" type="text" placeholder="sessionid=xxxxxxxxxxxx">
      <div class="hint">抖音登录态，从浏览器 F12 → Application → Cookies 获取</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>ASR 模型</label>
        <select id="asr-model" style="background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;width:100%;font-size:13px">
          <option value="tiny">Tiny（最快）</option>
          <option value="base" selected>Base（推荐）</option>
          <option value="small">Small（高精度）</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-submit" onclick="submitTask()" style="width:100%">🚀 开始处理</button>

    <div class="section-label" style="margin-top:24px">📥 批量采集（用户主页）</div>
    <div class="form-group">
      <label>用户主页链接 / 任意视频链接</label>
      <input id="user-url" type="text" placeholder="https://www.douyin.com/user/MS4wLjAB...">
      <div class="hint">支持用户主页链接或该用户的任意视频链接，自动识别作者主页</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>最大页数</label>
        <input id="max-pages" type="number" value="3" min="1" max="20">
      </div>
      <div class="form-group">
        <label style="visibility:hidden">.</label>
        <button class="btn btn-primary" id="btn-fetch-preview" onclick="previewUserVideos()" style="width:100%">🔍 预览</button>
      </div>
    </div>
    <div id="preview-area" style="display:none;margin-bottom:10px">
      <div style="background:var(--card);border-radius:8px;padding:10px;max-height:200px;overflow-y:auto;font-size:12px">
        <div id="preview-list"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-success" onclick="fetchAndProcess()" style="flex:1">📥 全部添加并处理</button>
        <button class="btn btn-ghost" onclick="togglePreview(false)" style="flex:1">取消</button>
      </div>
    </div>

    <div class="status-box" id="status-box">
      <div class="label">处理状态</div>
      <div class="msg" id="status-msg">等待操作...</div>
      <div id="status-error" class="error"></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="location.reload()" style="margin-top:10px;width:100%">↻ 刷新列表</button>
  </div>

  <!-- 右侧 -->
  <div class="panel-right">
    <div class="toolbar">
      <input id="search" type="text" placeholder="搜索标题 / 作者..." oninput="loadVideos()">
      <select id="topic-filter" onchange="loadVideos()">
        <option value="">全部作者</option>
      </select>
      <span class="count" id="video-count">0 条</span>
      <button class="btn btn-primary btn-sm" id="btn-ai-optimize" onclick="optimizeSelected()" style="margin-left:8px;display:none">🤖 AI优化选中</button>
    </div>
    <div class="video-grid" id="video-grid">
      <div style="color:var(--muted);padding:40px;text-align:center">加载中...</div>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2 id="modal-title"></h2>
    <div class="info-line" id="modal-info"></div>
    <div class="section">
      <h3>📌 基本信息</h3>
      <div class="content" id="modal-basic" style="max-height:80px"></div>
    </div>
    <div class="section">
      <h3>🏷️ 标签</h3>
      <div class="tags" id="modal-tags"></div>
    </div>
    <div class="section">
      <h3>📝 口播原文（ASR）</h3>
      <div class="content" id="modal-asr"></div>
    </div>
    <div class="section">
      <h3>🤖 AI 优化文案</h3>
      <div class="content" id="modal-ai-copy"></div>
    </div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>

<script>
// ── 全局状态 ──
let POLLING = false;

// ── 初始化 ──
async function init() {
  // 恢复保存的 Cookie
  const savedCookie = localStorage.getItem('v2t_cookie');
  if (savedCookie) document.getElementById('cookie').value = savedCookie;

  await loadTopics();
  await loadVideos();
  // 检查进行中的任务
  const st = await fetch('/api/status').then(r=>r.json());
  if (st.running) { startPolling(); setStatus("running", st.progress); }
}
init();

// ── 加载作者分类 ──
async function loadTopics() {
  const st = await fetch('/api/stats').then(r=>r.json());
  const sel = document.getElementById('topic-filter');
  // 清空旧选项（保留第一行"全部"）
  sel.innerHTML = "<option value=\"\">全部作者</option>";
  for (const [author,count] of Object.entries(st.topics || {})) {
    const opt = document.createElement('option');
    opt.value = author; opt.textContent = `${author}（${count}）`;
    sel.appendChild(opt);
  }
}

// ── 加载列表 ──
async function loadVideos() {
  const q = document.getElementById('search').value;
  const topic = document.getElementById('topic-filter').value;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (topic) params.set('topic', topic);
  const data = await fetch('/api/videos?' + params).then(r=>r.json());
  renderVideos(data.videos || []);
  document.getElementById('video-count').textContent = data.total + ' 条';
}

// ── 渲染卡片 ──
let selectedVideos = new Set(); // 存储选中的视频ID

function renderVideos(videos) {
  const grid = document.getElementById('video-grid');
  if (!videos.length) {
    grid.innerHTML = '<div style="color:var(--muted);padding:40px;text-align:center">暂无视频</div>';
    updateOptimizeButton();
    return;
  }
  grid.innerHTML = videos.map(v => {
    const status = v.status || '未开始';
    const badge = status === '已完成' ? '<span class="badge-done">✓</span>' : '<span class="badge-pending">⏳</span>';
    const videoKey = `${v.sheet}:${v.row}`;
    const isSelected = selectedVideos.has(videoKey);
    return `<div class="video-card ${isSelected?'selected':''}" data-key="${videoKey}" onclick='toggleSelect(event,"${v.sheet}","${v.row}")' ondblclick='openDetail("${v.sheet}","${v.row}")'>
      <div class="checkbox"></div>
      <div class="author">${esc(v.author||'')} <span class="badge">${esc(v.topic||'')}</span></div>
      <div class="title">${badge} ${esc(v.title||'')}</div>
      <div class="desc">${esc(v.description||'')}</div>
      <div class="meta">
        <span>🕐 ${esc(v.create_time||'')}</span>
        <span>📏 ${v.transcript_length||0}字</span>
        <span>⭐ ${v.article_score||'-'}</span>
        ${v.published ? '<span>📰 已发布</span>' : ''}
      </div>
    </div>`;
  }).join('');
  updateOptimizeButton();
}

// ── 选择切换 ──
function toggleSelect(event, sheet, row) {
  event.stopPropagation();
  const key = `${sheet}:${row}`;
  const card = event.currentTarget;
  
  if (event.shiftKey && window.lastSelected) {
    // Shift+点击：范围选择
    const allCards = [...document.querySelectorAll('.video-card')];
    const startIdx = allCards.findIndex(c => c.dataset.key === window.lastSelected);
    const endIdx = allCards.findIndex(c => c.dataset.key === key);
    if (startIdx >= 0 && endIdx >= 0) {
      const [min,max] = [Math.min(startIdx,endIdx), Math.max(startIdx,endIdx)];
      for (let i = min; i <= max; i++) {
        selectedVideos.add(allCards[i].dataset.key);
      }
    }
  } else {
    // 普通点击：切换选中
    if (selectedVideos.has(key)) {
      selectedVideos.delete(key);
    } else {
      selectedVideos.add(key);
    }
  }
  
  window.lastSelected = key;
  renderVideos([...document.querySelectorAll('.video-card')].map(c => ({
    sheet: c.dataset.key.split(':')[0],
    row: c.dataset.key.split(':')[1],
    status: c.querySelector('.badge-done') ? '已完成' : '未开始',
    title: c.querySelector('.title').textContent,
    author: c.querySelector('.author').textContent,
    topic: c.querySelector('.badge').textContent,
    description: c.querySelector('.desc').textContent,
    create_time: c.querySelector('.meta span').textContent.replace('🕐 ',''),
    transcript_length: c.querySelector('.meta span:nth-child(2)').textContent.replace('📏 ','').replace('字',''),
  })));
}

function updateOptimizeButton() {
  const btn = document.getElementById('btn-ai-optimize');
  btn.style.display = selectedVideos.size > 0 ? 'inline-block' : 'none';
  btn.textContent = selectedVideos.size > 0 ? `🤖 AI优化选中(${selectedVideos.size})` : '🤖 AI优化选中';
}

// ── 打开详情 ──
async function openDetail(sheet, row) {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('show');
  document.getElementById('modal-title').textContent = '加载中...';
  document.getElementById('modal-asr').textContent = '';
  document.getElementById('modal-ai-copy').textContent = '';

  const data = await fetch(`/api/videos/${sheet}/${row}`).then(r=>r.json());
  if (data.error) { document.getElementById('modal-title').textContent = '❌ '+data.error; return; }

  document.getElementById('modal-title').textContent = esc(data.title||'');
  document.getElementById('modal-info').innerHTML =
    `👤 ${esc(data.author)}　🕐 ${data.pub_time||'-'}　🆔 ${data.id||'-'}　📄 ${sheet} R${row}`;
  document.getElementById('modal-basic').innerHTML =
    `<b>状态：</b>${esc(data.status)}<br><b>链接：</b><a href="${esc(data.video_url)}" target="_blank" style="color:var(--accent)">${esc(data.link||'')}</a>` +
    (data.cover ? `<br><b>封面：</b><a href="${esc(data.cover)}" target="_blank" style="color:var(--accent)">查看封面</a>` : '');

  document.getElementById('modal-tags').innerHTML =
    (data.tags||'').split(/[,，\s]+/).filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('');

  document.getElementById('modal-asr').textContent = data.raw_transcript || data.asr || '（无 ASR 数据）';
  document.getElementById('modal-ai-copy').textContent = data.ai_copy || '（未优化）';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML = `
    <a href="${esc(data.video_url||'#')}" target="_blank"><button class="btn btn-primary btn-sm">▶ 观看原视频</button></a>
    <button class="btn btn-ghost btn-sm" onclick="copyText('${esc(data.raw_transcript||data.asr||'')}')">📋 复制口播</button>
  `;
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal-overlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ── 提交任务 ──
async function submitTask() {
  const links = document.getElementById('links').value.trim();
  const cookie = document.getElementById('cookie').value.trim();
  const asrModel = document.getElementById('asr-model').value;

  if (!links) return alert('请输入抖音链接');
  if (!cookie) return alert('请输入 Cookie');

  // 保存成功后的 Cookie
  localStorage.setItem('v2t_cookie', cookie);

  document.getElementById('btn-submit').disabled = true;
  setStatus("running", "提交中...");

  const resp = await fetch('/api/process', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({links, cookie, asr_model: asrModel})
  }).then(r=>r.json());

  if (resp.error) { setStatus("error", resp.error); document.getElementById('btn-submit').disabled = false; return; }
  startPolling();
}

// ── 轮询状态 ──
function startPolling() {
  if (POLLING) return;
  POLLING = true;
  document.getElementById('btn-submit').disabled = true;

  const poll = async () => {
    const st = await fetch('/api/status').then(r=>r.json());
    if (st.error) {
      setStatus("error", st.progress, st.error);
      // Cookie 相关错误：清除保存的 Cookie，提示重新填写
      if (st.error && /cookie|登录|过期|无效|认证/i.test(st.error)) {
        localStorage.removeItem('v2t_cookie');
        document.getElementById('cookie').value = '';
        alert('Cookie 可能已过期或无效，请重新填写。');
      }
    } else if (st.done) {
      setStatus(st.error ? "error" : "done", st.progress, st.error);
      POLLING = false;
      document.getElementById('btn-submit').disabled = false;
      await loadVideos();  // 刷新列表
    } else {
      setStatus("running", st.progress);
      setTimeout(poll, 2000);
    }
  };
  setTimeout(poll, 1000);
}

// ── 状态显示 ──
function setStatus(type, msg, err) {
  const box = document.getElementById('status-box');
  box.className = 'status-box';
  if (type === 'running') box.classList.add('status-running');
  else if (type === 'done') box.classList.add('status-done');
  else if (type === 'error') box.classList.add('status-error');
  document.getElementById('status-msg').textContent = msg || '';
  document.getElementById('status-error').textContent = err || '';
}

// ── 批量采集 ──
async function previewUserVideos() {
  const url = document.getElementById('user-url').value.trim();
  const cookie = document.getElementById('cookie').value.trim();
  const maxPages = document.getElementById('max-pages').value || 3;
  if (!url) return alert('请输入链接');
  if (!cookie) return alert('请输入 Cookie');

  localStorage.setItem('v2t_cookie', cookie);

  const btn = document.getElementById('btn-fetch-preview');
  btn.disabled = true; btn.textContent = '🔍 获取中...';

  try {
    const mode = url.includes('/user/') ? 'user_url' : 'video_url';
    const resp = await fetch('/api/preview_user_videos', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_url: mode==='user_url'?url:'', video_url: mode==='video_url'?url:'', cookie, max_pages: maxPages})
    }).then(r=>r.json());

    if (resp.error) { alert(resp.error); return; }
    renderPreview(resp);
  } catch(e) { alert('请求失败: '+e.message); }
  finally { btn.disabled = false; btn.textContent = '🔍 预览'; }
}

function renderPreview(data) {
  const area = document.getElementById('preview-area');
  const list = document.getElementById('preview-list');
  area.style.display = 'block';

  let html = `<div style="color:var(--muted);margin-bottom:8px">找到 <b>${data.total}</b> 条视频 · 主页: ${data.user_url||'-'}</div>`;
  (data.videos||[]).forEach((v,i) => {
    html += `<div style="padding:3px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
      <span style="color:var(--muted);font-size:11px;min-width:24px">${i+1}.</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(v.url)}">${v.aweme_id||v.url}</span>
    </div>`;
  });
  list.innerHTML = html;
}

async function fetchAndProcess() {
  const url = document.getElementById('user-url').value.trim();
  const cookie = document.getElementById('cookie').value.trim();
  const maxPages = document.getElementById('max-pages').value || 3;
  if (!cookie) return alert('请输入 Cookie');

  localStorage.setItem('v2t_cookie', cookie);

  const resp = await fetch('/api/fetch_user_videos', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      user_url: url.includes('/user/') ? url : '',
      video_url: url.includes('/user/') ? '' : url,
      cookie, max_pages: maxPages
    })
  }).then(r=>r.json());

  if (resp.error) { alert(resp.error); return; }

  const total = resp.total || 0;
  if (total === 0) { alert('没有找到视频'); return; }

  if (!confirm(`将获取 ${total} 条视频并自动进行 ASR 处理（无需再点「开始处理」）。\n确定继续吗？`)) return;

  togglePreview(false);
  setStatus('running', `📥 正在获取并处理 ${total} 条视频...`);

  // 调用全自动流水线 API
  const procResp = await fetch('/api/fetch_and_process', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      user_url: url.includes('/user/') ? url : '',
      video_url: url.includes('/user/') ? '' : url,
      cookie, max_pages: maxPages
    })
  }).then(r=>r.json());

  if (procResp.error) {
    setStatus('error', procResp.error);
    return;
  }

  // 后台已启动，轮询状态
  startPolling();
}

function togglePreview(show) {
  document.getElementById('preview-area').style.display = show ? 'block' : 'none';
}

// ── AI优化选中视频 ──
async function optimizeSelected() {
  if (selectedVideos.size === 0) return alert('请先选择要优化的视频');
  
  const keys = [...selectedVideos];
  if (!confirm(`将对 ${keys.length} 个视频进行AI优化，确定继续吗？`)) return;
  
  setStatus('running', `🤖 正在优化 ${keys.length} 个视频...`);
  
  try {
    const resp = await fetch('/api/optimize_batch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({videos: keys})
    }).then(r=>r.json());
    
    if (resp.error) {
      setStatus('error', resp.error);
      return;
    }
    
    setStatus('done', `✅ 已优化 ${resp.success} 个视频`);
    selectedVideos.clear();
    await loadVideos();
  } catch (e) {
    setStatus('error', '请求失败: ' + e.message);
  }
}

// ── 工具 ──
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function copyText(t) { navigator.clipboard.writeText(t||'').then(()=>alert('已复制')); }
