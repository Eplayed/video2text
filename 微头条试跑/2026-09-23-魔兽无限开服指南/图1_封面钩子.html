<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; background: #14161d; color: #e8e4d8; overflow: hidden; }
  .wrap { width: 1080px; height: 1440px; padding: 70px 70px 60px; display: flex; flex-direction: column; background: linear-gradient(160deg, #1a1d28 0%, #14161d 55%, #171a22 100%); position: relative; }
  .topline { display: flex; align-items: center; gap: 16px; margin-bottom: 46px; }
  .badge { background: #c9a227; color: #14161d; font-weight: 700; font-size: 26px; padding: 8px 22px; border-radius: 6px; letter-spacing: 2px; }
  .topline .src { font-size: 24px; color: #8b8fa0; letter-spacing: 1px; }
  .date { margin-left: auto; font-size: 26px; color: #c9a227; font-weight: 600; }
  h1 { font-size: 92px; line-height: 1.28; font-weight: 800; letter-spacing: 2px; }
  h1 .gold { color: #f0c954; }
  .sub { margin-top: 34px; font-size: 40px; color: #b8bcc8; letter-spacing: 3px; }
  .countdown { margin-top: 60px; background: rgba(201,162,39,0.12); border: 2px solid rgba(201,162,39,0.45); border-radius: 18px; padding: 40px 46px; }
  .countdown .label { font-size: 28px; color: #c9a227; letter-spacing: 4px; margin-bottom: 16px; font-weight: 600; }
  .countdown .big { font-size: 64px; font-weight: 800; color: #f0c954; }
  .countdown .note { margin-top: 14px; font-size: 28px; color: #9aa0b0; }
  .hooks { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .hook { display: flex; align-items: center; gap: 24px; background: #1e2130; border-left: 6px solid #c9a227; border-radius: 10px; padding: 28px 34px; }
  .hook .n { font-size: 44px; font-weight: 800; color: #c9a227; min-width: 60px; }
  .hook .t { font-size: 36px; font-weight: 600; }
  .hook .d { font-size: 26px; color: #8b8fa0; margin-top: 6px; font-weight: 400; }
  .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2a2e3c; padding-top: 26px; }
  .footer .l { font-size: 24px; color: #6b7080; }
  .footer .r { font-size: 24px; color: #c9a227; font-weight: 600; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div class="badge">魔兽·无限</div>
    <div class="src">开服决策指南 · 1/4</div>
    <div class="date">B测口径</div>
  </div>
  <h1>11月4日开服<br>进游戏前必须<br>想清楚的 <span class="gold">4 件事</span></h1>
  <div class="sub">全球一服 · 没有毕业装备 · 插件大清洗</div>
  <div class="countdown">
    <div class="label">关键时间线</div>
    <div class="big">11月4日开服 → 12月7日开团本</div>
    <div class="note">满级约 160 小时：每天 4 小时 ≈ 40 天，开服就练刚好赶上开荒</div>
  </div>
  <div class="hooks">
    <div class="hook"><div class="n">01</div><div><div class="t">选模式 = 选服务器</div><div class="d">全球统一大服，同模式才能组队</div></div></div>
    <div class="hook"><div class="n">02</div><div><div class="t">WA 战斗插件全禁</div><div class="d">怀旧服插件习惯要清零</div></div></div>
    <div class="hook"><div class="n">03</div><div><div class="t">没有毕业装 BIS</div><div class="d">装备按场景特化，按手感选职业</div></div></div>
    <div class="hook"><div class="n">04</div><div><div class="t">副本刷怪升级被废</div><div class="d">练级最优解变了，看第 4 张</div></div></div>
  </div>
  <div class="footer">
    <div class="l">多源信息整合 · 详见文末来源</div>
    <div class="r">AI 辅助生成</div>
  </div>
</div>
</body>
</html>
